name: pm10-batch
x-worker: &worker
  image: pm10-batch:1.0
  build: .
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  environment:
    PM10_DATA: /data
    PGHOST: database
    PGDATABASE: pm10
    PGUSER: pm10
    PM10_PASSWORD_FILE: /run/secrets/db_password
    SPARK_DRIVER_MEMORY: 3g
  volumes:
    - ./runtime:/data
  secrets:
    - db_password
  mem_limit: 5g
  cpus: 4
  init: true
services:
  database:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_DB: pm10
      POSTGRES_USER: pm10_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - db_password
      - admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm10_admin -d pm10"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped
  ingest:
    <<: *worker
    command: ["ingest", "--year", "2024"]
  transform:
    <<: *worker
    depends_on:
      database:
        condition: service_healthy
    command: ["run", "--year", "2024"]
  test:
    <<: *worker
    profiles: ["test"]
    entrypoint: ["/app/scripts/entrypoint.sh", "python3", "-m", "pytest"]
    command: ["-q", "-p", "no:cacheprovider", "/app/tests"]
volumes:
  postgres_data:
secrets:
  db_password:
    file: ./secrets/db_password.txt
  admin_password:
    file: ./secrets/admin_password.txt
